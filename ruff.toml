# ruff 配置：保守规则集（E4/E7/E9 + F 类），error 门槛
#
# 设计决策（见 engineering-foundation design.md D2）：
# - 存量代码存在大量历史问题（F401/E701/E722/E741/E402/F541/F841 共 150+ 处），
#   一次性整改会混入在途修改且难以 review，故先 ignore，保证门槛立即为 0。
# - 保留规则持续拦截新代码的实质错误（未定义名称 F821、语法类 E4/E7/E9 等）。
# - 存量清理作为独立变更推进（"lint 存量收敛"），届时按模块逐个启用。

[lint]
# 保守集：import/语法/运行时错误 + Pyflakes（F 类未定义变量等实质问题）
select = ["E4", "E7", "E9", "F"]

# 存量已知问题（迁移期 ignore，新代码不得引入）：
#   E402  模块级 import 不在顶部（tests 的 sys.path 注入惯用法）
#   E701  一行多语句
#   E722  裸 except（存量 15 处，需逐个审阅后改 except Exception）
#   E741  模糊变量名（l/I/O）
#   F401  未使用导入（存量 50 处）
#   F541  f-string 无占位符
#   F841  未使用变量（存量 13 处）
ignore = ["E402", "E701", "E722", "E741", "F401", "F541", "F841"]
