name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          pip install fastapi uvicorn pydantic PyQt6 pywebview cryptography
          
      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: pytest tests/ -v --cov=backend --cov-report=xml
        
      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build frontend
        run: npm run build
        
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 1

  type-sync-check:
    runs-on: ubuntu-latest
    name: Verify TypeScript/Python type synchronization
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Count Python types
        id: python-types
        run: |
          COUNT=$(grep -c "class.*BaseModel" backend/loglayer/schemas.py || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Python Pydantic models: $COUNT"
      
      - name: Count TypeScript types
        id: ts-types
        run: |
          # Count interface and enum declarations
          COUNT=$(grep -cE "^(export )?(interface|enum) " frontend/src/types.ts || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "TypeScript interfaces/enums: $COUNT"
      
      - name: Verify type counts match
        run: |
          PYTHON_COUNT=${{ steps.python-types.outputs.count }}
          TS_COUNT=${{ steps.ts-types.outputs.count }}
          
          echo "Python types: $PYTHON_COUNT"
          echo "TypeScript types: $TS_COUNT"
          
          if [ "$PYTHON_COUNT" != "$TS_COUNT" ]; then
            echo "::error::Type count mismatch! Python has $PYTHON_COUNT, TypeScript has $TS_COUNT. Update both files and docs/TYPE_SYNC.md"
            exit 1
          fi
          
          echo "✓ Type counts match"