name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests (unit + integration)
        run: python -m pytest tests/unit tests/integration -v

      - name: Lint (ruff)
        run: ruff check backend tests

      - name: Run lightweight benchmark guard
        run: python tests/benchmarks/benchmark_guard.py

      - name: Verify big-file sample generator works
        run: |
          python -c "import sys; sys.path.insert(0, 'tests/benchmarks'); from gen_big_file import generate_test_file; generate_test_file('/tmp/ci_sample.log', size_gb=0.05)"
          ls -la /tmp/ci_sample.log

  frontend:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
