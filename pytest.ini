[pytest]
# e2e 测试需起前后端（backend + vite + Playwright），默认被 tests/conftest.py
# 的 collect_ignore 排除。显式运行：
#   python3 -m pytest tests/e2e -v
# 轻量运行（不含 1.3GB 大文件测试）：
#   python3 -m pytest tests/e2e -m "e2e and not heavy" -v
markers =
    e2e: 端到端测试（启动 backend + vite + Playwright），验证前端 UI 交互与显示
    heavy: e2e 大文件专项（打开 1.3GB large_test.log），索引峰值内存高、耗时长
addopts = -ra
testpaths = tests
